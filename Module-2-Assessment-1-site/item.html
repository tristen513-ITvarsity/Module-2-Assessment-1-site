<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meal Details | Ember & Fig</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <span class="logo-mark"><i class="fa-solid fa-fire-flame-curved"></i></span>
      <div>
        <p class="logo-name">Ember & Fig</p>
        <p class="logo-tag">Neighborhood Fire Kitchen</p>
      </div>
    </div>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="starters.html">Starters</a>
      <a href="mains.html">Mains</a>
      <a href="desserts.html">Desserts</a>
      <a href="drinks.html">Drinks</a>
    </nav>
  </header>
  <main>
    <section class="detail">
      <img id="food-image" src="" alt="" />
      <div class="detail-info">
        <p id="food-category" class="detail-category">Category</p>
        <h1 id="food-name">Meal Name</h1>
        <p id="food-price" class="detail-price">$0</p>
        <p><strong>Serving size:</strong> <span id="food-size">Size</span></p>
        <p id="food-description">Meal description will appear here.</p>

        <h3>Choose your extras</h3>
        <ul id="extras-list" class="extras"></ul>

        <form class="notes" action="thank-you.html" method="get">
          <label for="notes">Extra notes or requests</label>
          <textarea id="notes" name="notes" placeholder="Allergies? Extra sauce? Tell us."></textarea>
          <button class="btn" type="submit">Place Order</button>
        </form>
        <a class="text-link" id="back-link" href="index.html">Back to menu</a>
      </div>
    </section>
  </main>
  <script src="menu-data.js"></script>
  <script src="item.js"></script>
</body>
</html>
